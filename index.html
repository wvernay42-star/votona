<title>Votona</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" type="image/png" href="assets/ui/logo-head.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root{
    --bg: #fbfaf7;
    --bg-raised: #ffffff;
    --ink: #191d2b;
    --ink-soft: #4d5468;
    --ink-faint: #8790a3;
    --line: #e4dfd0;
    --line-soft: #eee9dc;
    --accent: #7C3AED;
    --accent-ink: #ffffff;
    --accent-soft: #efe4fd;
    --blue: #2f5fb5;
    --blue-soft: #e3ebfa;
    --gold: #d98a13;
    --gold-soft: #fbecd1;
    --good: #2c9354;
    --good-soft: #ddf3e4;
    --bad: #d1453a;
    --bad-soft: #fbe0dd;
    --neutral: #8a8170;
    --neutral-soft: #f1ece0;
    --plum: #7a4fb0;
    --plum-soft: #ece3f7;
    --teal: #1f8f8a;
    --teal-soft: #ddf1ef;
    --masthead-bg: #F6F2FE;
    --masthead-ink: #191d2b;
    --masthead-line: rgba(25,29,43,.14);
    --shadow: 0 1px 2px rgba(28,34,48,.07), 0 10px 28px -12px rgba(124,58,237,.18);
    --radius: 26px;
    --display: 'Baloo 2', ui-rounded, system-ui, sans-serif;
    --sans: 'Work Sans', ui-sans-serif, system-ui, sans-serif;
    --mono: 'IBM Plex Mono', ui-monospace, monospace;
    --brand-gradient: conic-gradient(from 210deg, var(--accent), var(--gold), var(--blue), var(--plum), var(--accent));
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg: #14171c;
      --bg-raised: #1c2028;
      --ink: #f1ede4;
      --ink-soft: #aab0c0;
      --ink-faint: #727890;
      --line: #2d323f;
      --line-soft: #252a36;
      --accent: #A78BFA;
      --accent-ink: #1c1230;
      --accent-soft: #2f2350;
      --blue: #7aa6ff;
      --blue-soft: #1f2a42;
      --gold: #f0b34d;
      --gold-soft: #3a2a12;
      --good: #7ad693;
      --good-soft: #1a2e20;
      --bad: #ff6b57;
      --bad-soft: #3a221e;
      --neutral: #a8a08f;
      --neutral-soft: #28241d;
      --plum: #b98bee;
      --plum-soft: #2c2140;
      --teal: #4fd9d1;
      --teal-soft: #16302e;
      --shadow: 0 1px 2px rgba(0,0,0,.35), 0 10px 30px -12px rgba(167,139,250,.25);
    }
  }
  :root[data-theme="dark"]{
    --bg: #14171c;
    --bg-raised: #1c2028;
    --ink: #f1ede4;
    --ink-soft: #aab0c0;
    --ink-faint: #727890;
    --line: #2d323f;
    --line-soft: #252a36;
    --accent: #A78BFA;
    --accent-ink: #1c1230;
    --accent-soft: #2f2350;
    --blue: #7aa6ff;
    --blue-soft: #1f2a42;
    --gold: #f0b34d;
    --gold-soft: #3a2a12;
    --good: #7ad693;
    --good-soft: #1a2e20;
    --bad: #ff6b57;
    --bad-soft: #3a221e;
    --neutral: #a8a08f;
    --neutral-soft: #28241d;
    --plum: #b98bee;
    --plum-soft: #2c2140;
    --teal: #4fd9d1;
    --teal-soft: #16302e;
    --shadow: 0 1px 2px rgba(0,0,0,.35), 0 10px 30px -12px rgba(167,139,250,.25);
  }

  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--ink); font-family:var(--sans);
    min-height:100vh; -webkit-font-smoothing:antialiased;
  }
  ::selection{ background:var(--accent-soft); }
  button{ font-family:inherit; }
  h1,h2,h3{ font-family:var(--display); font-weight:600; text-wrap:balance; margin:0; }
  h1{ font-size:clamp(30px,5vw + 14px,46px); font-weight:700; text-align:center; letter-spacing:-.01em; line-height:1.1; }
  .mono{ font-family:var(--mono); font-variant-numeric:tabular-nums; }
  a{ color:inherit; }
  :focus-visible{ outline:2px solid var(--blue); outline-offset:2px; border-radius:4px; }

  #shell{ max-width:1180px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; width:100%; }

  header.topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:16px clamp(20px,4vw,40px); border-bottom:3px solid var(--accent);
    position:sticky; top:0; background:var(--masthead-bg); z-index:20;
  }
  .brand{ display:flex; align-items:center; gap:9px; }
  .brand-home{
    display:flex; align-items:center; gap:9px; background:none; border:none; padding:0;
    cursor:pointer; font:inherit; color:inherit; -webkit-tap-highlight-color:transparent;
  }
  .brand-home:hover .name{ color:var(--accent); }
  .brand .mark{
    width:40px; height:32px; flex:none;
    animation: markSettle .9s cubic-bezier(.22,1,.36,1) both;
    transition: transform .45s cubic-bezier(.34,1.56,.64,1);
  }
  .brand .mark:hover{ transform: rotate(-8deg) scale(1.08); }
  .brand .mark svg, .brand .mark img{ display:block; width:100%; height:100%; object-fit:contain; }
  .brand .name{ font-family:var(--display); font-weight:700; font-size:18px; letter-spacing:.2px; color:var(--masthead-ink); white-space:nowrap; transition:color .15s ease; }
  .brand .year{ font-family:var(--mono); font-size:11px; color:var(--accent); letter-spacing:.06em; white-space:nowrap; }
  @media (max-width:420px){ .brand .year{ display:none; } }
  .topbar-actions{ display:flex; align-items:center; gap:6px; }
  .icon-btn{
    width:34px; height:34px; border-radius:50%; border:1px solid var(--masthead-line);
    background:transparent; color:var(--masthead-ink); display:flex; align-items:center;
    justify-content:center; cursor:pointer; font-size:15px;
  }
  .icon-btn:hover{ color:var(--accent); border-color:var(--accent); }

  main{ flex:1; padding:24px clamp(20px,4vw,40px) 48px; max-width:680px; margin:0 auto; width:100%; }
  main.app-wide{ max-width:100%; }

  .eyebrow{
    font-family:var(--mono); font-size:11px; letter-spacing:.08em; text-transform:uppercase;
    color:var(--ink-faint); margin-bottom:6px; display:block; text-align:center;
  }

  /* ---------- Buttons ---------- */
  .btn{
    appearance:none; border:none; cursor:pointer; border-radius:18px; padding:14px 22px;
    font-size:15px; font-weight:800; font-family:var(--sans); display:inline-flex; align-items:center;
    justify-content:center; gap:8px; transition:transform .1s ease, border-bottom-width .1s ease;
  }
  .btn:active{ transform:translateY(2px); }
  .btn-primary{ background:var(--ink); color:var(--bg); width:100%; }
  :root[data-theme="dark"] .btn-primary, @media (prefers-color-scheme: dark){ }
  .btn-accent{
    background:var(--accent); color:var(--accent-ink); width:100%;
    border-bottom:4px solid color-mix(in srgb, var(--accent) 70%, black);
  }
  .btn-accent:active{ border-bottom-width:1px; }
  .btn-ghost{ background:transparent; color:var(--ink-soft); border:2px solid color-mix(in srgb, var(--accent) 20%, var(--line)); }
  .btn-ghost:hover{ color:var(--ink); border-color:var(--ink-faint); }
  .btn-block{ width:100%; }
  .btn-sm{ padding:8px 14px; font-size:13px; border-radius:14px; }
  .btn[disabled]{ opacity:.4; cursor:not-allowed; }

  /* ---------- Profile picker ---------- */
  .profile-grid{ display:grid; gap:12px; margin-top:18px; max-width:760px; margin-left:auto; margin-right:auto; }
  .profile-card{
    display:flex; align-items:center; gap:13px; padding:14px 16px; border-radius:var(--radius);
    background:var(--bg-raised); border:2px solid color-mix(in srgb, var(--accent) 20%, var(--line-soft)); cursor:pointer; text-align:left;
    box-shadow:var(--shadow); width:100%;
  }
  .profile-avatar{
    width:42px; height:42px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-family:var(--display); font-weight:600; font-size:16px; color:#fff; flex:none;
  }
  .profile-meta{ flex:1; min-width:0; }
  .profile-meta .pname{ font-weight:600; font-size:15px; }
  .profile-meta .psub{ font-size:12.5px; color:var(--ink-faint); margin-top:2px; }
  .profile-arrow{ color:var(--ink-faint); }
  .new-profile-form{
    margin-top:16px; padding:16px; border:1px dashed var(--line); border-radius:var(--radius);
    display:none; gap:10px; flex-direction:column; max-width:420px;
  }
  .dash-head{ max-width:640px; margin-left:auto; margin-right:auto; }
  .new-profile-form.open{ display:flex; }
  input[type="text"], input[type="email"], select, textarea{
    font-family:var(--sans); font-size:14.5px; padding:11px 14px; border-radius:16px;
    border:2px solid color-mix(in srgb, var(--accent) 18%, var(--line)); background:var(--bg); color:var(--ink); width:100%;
  }
  input[type="text"]:focus, input[type="email"]:focus, select:focus, textarea:focus{ border-color:var(--blue); }
  label.field-label{ font-size:12px; color:var(--ink-soft); font-weight:600; margin-bottom:5px; display:block; }

  .intro-copy{ color:var(--ink-soft); font-size:14.5px; line-height:1.55; margin-top:8px; max-width:640px; }

  /* ---------- Dashboard ---------- */
  .banner{
    display:flex; gap:12px; align-items:flex-start; padding:16px 18px; border-radius:22px;
    background:var(--gold-soft); border:1px solid color-mix(in srgb, var(--gold) 35%, transparent);
    margin-bottom:16px;
  }
  .banner .dot{ width:8px; height:8px; border-radius:50%; background:var(--gold); margin-top:6px; flex:none; }
  .banner strong{ font-weight:600; }
  .banner p{ margin:2px 0 0; font-size:13.5px; color:var(--ink-soft); line-height:1.5; }
  .banner button{ margin-top:8px; }

  .stat-row{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:16px 0; }
  .stat-tile{ background:var(--bg-raised); border:2px solid color-mix(in srgb, var(--accent) 20%, var(--line-soft)); border-radius:20px; padding:16px 17px; }
  .stat-tile .num{ font-family:var(--mono); font-size:22px; font-weight:600; }
  .stat-tile .lbl{ font-size:11.5px; color:var(--ink-faint); margin-top:2px; text-transform:uppercase; letter-spacing:.04em; }

  .progress-track{ height:6px; background:var(--line-soft); border-radius:99px; overflow:hidden; margin-top:8px; }
  .progress-fill{ height:100%; background:var(--accent); border-radius:99px; transition:width .3s ease; }

  .candidate-list{ display:grid; gap:8px; margin-top:10px; }
  .candidate-row{
    display:flex; align-items:center; gap:11px; padding:13px 15px; border-radius:20px;
    background:var(--bg-raised); border:2px solid color-mix(in srgb, var(--accent) 20%, var(--line-soft));
  }
  .cand-dot{ width:10px; height:10px; border-radius:50%; flex:none; }
  .cand-name{ font-size:13.5px; font-weight:600; flex:1; }
  .cand-party{ font-size:11.5px; color:var(--ink-faint); }
  .badge-new{
    font-family:var(--mono); font-size:10px; text-transform:uppercase; letter-spacing:.05em;
    background:var(--accent); color:var(--accent-ink); padding:3px 9px; border-radius:999px;
    display:inline-block;
  }
  .badge-withdrawn{
    font-family:var(--mono); font-size:10px; text-transform:uppercase; letter-spacing:.05em;
    background:var(--line-soft); color:var(--ink-faint); padding:3px 9px; border-radius:999px;
  }
  .candidate-row.withdrawn{ opacity:.55; }
  .candidate-row.withdrawn .cand-dot{ filter:grayscale(1); }

  section.block{ margin-top:32px; }
  section.block h2{ font-size:19px; margin-bottom:3px; }
  section.block .sub{ font-size:13px; color:var(--ink-faint); }

  /* ---------- Vote screen ---------- */
  .vote-progress{ display:flex; align-items:center; gap:10px; margin-bottom:18px; }
  .vote-progress .progress-track{ flex:1; margin:0; }
  .vote-progress .count{ font-family:var(--mono); font-size:12px; color:var(--ink-faint); white-space:nowrap; }

  .card-stack{ position:relative; height:auto; }
  .vote-card{
    background:var(--bg-raised); border:2px solid color-mix(in srgb, var(--accent) 20%, var(--line-soft)); border-radius:28px; padding:26px 22px;
    box-shadow:var(--shadow); touch-action:pan-y; user-select:none; cursor:grab;
  }
  .vote-card:active{ cursor:grabbing; }
  .vote-card .cat{
    font-family:var(--mono); font-size:11px; text-transform:uppercase; letter-spacing:.07em; color:var(--blue);
    background:var(--blue-soft); display:inline-block; padding:4px 9px; border-radius:10px; margin-bottom:14px;
  }
  .vote-card .statement{ font-family:var(--display); font-size:22px; line-height:1.32; font-weight:500; cursor:pointer; }
  .context-hint{
    display:inline-flex; align-items:center; justify-content:center; width:17px; height:17px;
    margin-left:6px; font-family:var(--sans); font-size:11px; font-weight:600; color:var(--ink-faint);
    border:1px solid var(--line); border-radius:50%; vertical-align:middle; flex:none;
  }
  .statement:hover .context-hint{ color:var(--blue); border-color:var(--blue); }
  .context-panel{
    display:none; margin-top:12px; padding:10px 12px; background:var(--blue-soft); border-radius:14px;
    font-size:12.5px; line-height:1.5; color:var(--ink-soft);
  }
  .context-panel.open{ display:block; }
  .swipe-hint{ display:flex; justify-content:space-between; margin-top:20px; font-size:12px; color:var(--ink-faint); }

  .stance-buttons{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-top:16px; }
  .stance-btn{
    border-radius:20px; padding:16px 6px; border:2px solid color-mix(in srgb, var(--accent) 18%, var(--line)); background:var(--bg-raised);
    display:flex; flex-direction:column; align-items:center; gap:5px; cursor:pointer; font-size:12.5px; font-weight:600;
    color:var(--ink-soft);
  }
  .stance-btn .ic{ font-size:19px; }
  .stance-btn.contre:hover{ border-color:var(--bad); color:var(--bad); }
  .stance-btn.neutre:hover{ border-color:var(--neutral); color:var(--neutral); }
  .stance-btn.pour:hover{ border-color:var(--good); color:var(--good); }

  .importance-row{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-top:18px; }
  .imp-btn{
    border-radius:20px; padding:15px 6px; border:2px solid color-mix(in srgb, var(--accent) 18%, var(--line)); background:var(--bg-raised);
    cursor:pointer; font-size:12.5px; font-weight:600; color:var(--ink-soft); text-align:center; line-height:1.3;
  }
  .imp-btn:hover{ border-color:var(--blue); color:var(--blue); }
  .imp-btn.picked{ border-color:var(--blue); background:var(--blue-soft); color:var(--blue); }

  .reveal-row{ display:flex; flex-wrap:wrap; gap:6px; margin-top:18px; }
  .reveal-chip{
    display:flex; align-items:center; gap:5px; font-size:11.5px; padding:5px 8px 5px 6px; border-radius:99px;
    background:var(--line-soft); color:var(--ink-soft);
  }
  .reveal-chip .ic{ font-size:12px; }

  .skip-link{ display:block; text-align:center; margin-top:14px; font-size:12.5px; color:var(--ink-faint); background:none; border:none; cursor:pointer; }

  /* ---------- Results ---------- */
  .podium{ display:flex; align-items:flex-end; gap:10px; margin:22px 0 28px; }
  .podium-step{ flex:1; display:flex; flex-direction:column; align-items:center; text-align:center; min-width:0; }
  .podium-step.rank-1{ order:2; }
  .podium-step.rank-2{ order:1; }
  .podium-step.rank-3{ order:3; }
  .podium-medal{
    font-family:var(--mono); font-weight:700; font-size:11px; color:var(--ink-soft);
    background:var(--line-soft); border-radius:99px; padding:2px 8px; margin-bottom:8px;
  }
  .podium-step.rank-1 .podium-medal{ background:var(--gold-soft); color:var(--gold); }
  .podium-avatar{
    width:44px; height:44px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    color:#fff; font-family:var(--display); font-weight:600; font-size:16px; flex:none;
  }
  .podium-step.rank-1 .podium-avatar{ width:56px; height:56px; font-size:19px; }
  .podium-name{ font-weight:600; font-size:12.5px; line-height:1.25; margin-top:8px; }
  .podium-party{ font-size:10.5px; color:var(--ink-faint); margin-top:1px; }
  .podium-score{ font-family:var(--mono); font-weight:700; font-size:16px; margin-top:5px; }
  .podium-block{
    width:100%; border-radius:14px 14px 6px 6px; margin-top:10px; display:flex; align-items:flex-start;
    justify-content:center; padding-top:7px; box-sizing:border-box;
  }
  .podium-step.rank-1 .podium-block{ height:72px; }
  .podium-step.rank-2 .podium-block{ height:50px; }
  .podium-step.rank-3 .podium-block{ height:36px; }
  .podium-block .rn{ font-family:var(--mono); font-weight:700; color:#fff; font-size:13px; }
  .results-subhead{ font-size:12px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.05em; font-family:var(--mono); margin:22px 0 10px; }

  .result-row{
    background:var(--bg-raised); border:2px solid color-mix(in srgb, var(--accent) 20%, var(--line-soft));
    border-radius:22px; padding:16px 18px; margin-bottom:12px; cursor:pointer;
  }
  .result-top{ display:flex; align-items:center; gap:11px; }
  .result-rank{ font-family:var(--mono); font-size:12px; color:var(--ink-faint); width:16px; }
  .result-name{ flex:1; }
  .result-name .n{ font-weight:600; font-size:14.5px; }
  .result-name .p{ font-size:11.5px; color:var(--ink-faint); }
  .result-score{ font-family:var(--mono); font-weight:600; font-size:17px; }
  .result-bar-track{ height:7px; background:var(--line-soft); border-radius:99px; margin-top:10px; overflow:hidden; }
  .result-bar-fill{ height:100%; border-radius:99px; }
  .result-detail{ display:none; margin-top:14px; padding-top:12px; border-top:1px solid var(--line-soft); }
  .result-row.open .result-detail{ display:block; }
  .rd-item{ display:flex; gap:8px; padding:6px 0; font-size:12.5px; align-items:flex-start; }
  .rd-item .ic{ flex:none; margin-top:1px; }
  .rd-item .txt{ color:var(--ink-soft); }
  .rd-item .txt b{ color:var(--ink); }

  /* ---------- Admin ---------- */
  .admin-tabs{ display:flex; gap:6px; margin-bottom:16px; border-bottom:1px solid var(--line-soft); }
  .admin-tab{ background:none; border:none; padding:10px 4px; margin-right:14px; font-size:13.5px; font-weight:600; color:var(--ink-faint); cursor:pointer; border-bottom:2px solid transparent; }
  .admin-tab.active{ color:var(--ink); border-color:var(--accent); }
  .admin-item{ background:var(--bg-raised); border:2px solid color-mix(in srgb, var(--accent) 20%, var(--line-soft)); border-radius:20px; padding:14px 16px; margin-bottom:10px; }
  .admin-item-head{ display:flex; align-items:center; gap:10px; cursor:pointer; }
  .admin-item-head .swatch{ width:11px; height:11px; border-radius:50%; flex:none; }
  .admin-item-head .t{ flex:1; font-weight:600; font-size:13.5px; }
  .admin-item-head .meta{ font-size:11px; color:var(--ink-faint); font-family:var(--mono); }
  .admin-form{ display:none; margin-top:12px; padding-top:12px; border-top:1px solid var(--line-soft); flex-direction:column; gap:10px; }
  .admin-item.open .admin-form{ display:flex; }
  .pos-grid{ display:flex; flex-direction:column; gap:8px; }
  .pos-row{ display:grid; grid-template-columns:1fr auto; gap:8px; align-items:start; }
  .pos-row .topic-txt{ font-size:12.5px; color:var(--ink-soft); line-height:1.4; padding-top:8px; }
  .pos-row select{ width:auto; min-width:100px; }
  .pos-detail{ grid-column:1 / -1; }
  .form-actions{ display:flex; gap:8px; margin-top:4px; }
  .danger-link{ background:none; border:none; color:var(--bad); font-size:12px; cursor:pointer; padding:0; }
  .disclaimer{ font-size:12px; color:var(--ink-faint); line-height:1.5; background:var(--line-soft); padding:13px 15px; border-radius:18px; margin-bottom:16px; }

  footer.appfoot{ text-align:center; padding:22px clamp(20px,4vw,40px) 30px; font-size:11.5px; color:var(--ink-faint); max-width:680px; margin:0 auto; width:100%; }
  footer.appfoot a{ text-decoration:underline; cursor:pointer; }

  .sponsor-card{
    display:block; text-align:left; background:var(--bg-raised); border:2px solid color-mix(in srgb, var(--accent) 20%, var(--line-soft));
    border-radius:20px; padding:15px 17px; margin-bottom:16px; text-decoration:none; color:inherit;
  }
  a.sponsor-card:hover{ border-color:var(--ink-faint); }
  .sponsor-label{
    font-family:var(--mono); font-size:9.5px; text-transform:uppercase; letter-spacing:.08em;
    color:var(--ink-faint); display:block; margin-bottom:5px;
  }

function safeGet(key, fallback){
  try{
    var raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : fallback;
  }catch(e){ return fallback; }
}
function safeSet(key, val){
  try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){}
}

function loadProfiles(){ return safeGet(LS_PROFILES, {}); }
function saveProfiles(p){ safeSet(LS_PROFILES, p); }

}

function uid(prefix){ return prefix + "-" + Math.random().toString(36).slice(2,9); }
function daysSince(iso){
  var d = (new Date() - new Date(iso)) / 86400000;
  return d;
}
function escapeHtml(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}

function mascotSvg(color, size){
  size = size || 96;
  return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">' +
    '<rect x="6" y="6" width="108" height="108" rx="38" fill="' + color + '" stroke="#14121F" stroke-width="6"/>' +
    '<circle cx="44" cy="56" r="8" fill="#14121F"/>' +
    '<circle cx="76" cy="56" r="8" fill="#14121F"/>' +
    '<circle cx="41" cy="53" r="2.5" fill="#fff"/>' +
    '<circle cx="73" cy="53" r="2.5" fill="#fff"/>' +
    '<path d="M42 76c6 8 30 8 36 0" stroke="#14121F" stroke-width="6" stroke-linecap="round" fill="none"/>' +
    '<path d="M92 18l4.5 9.5L106 32l-9.5 4.5L92 46l-4.5-9.5L78 32l9.5-4.5z" fill="#FFD166" stroke="#14121F" stroke-width="4" stroke-linejoin="round"/>' +
    '</svg>';
}

function mascotImgHtml(cat, level, width, height, fallbackColor){
  var meta = CATEGORY_META[cat] || {};
  width = width || 96;
  height = height || width;
  var fallbackSize = Math.min(width, height);
  if(!meta.slug) return mascotSvg(fallbackColor || meta.pop || "#7C3AED", fallbackSize);
  var src = "assets/characters/" + meta.slug + "-n" + (level || 1) + ".png";
  return '<img class="mascot-img" data-cat="' + escapeHtml(cat) + '" data-size="' + fallbackSize + '" data-fallback="' + escapeHtml(fallbackColor || "") + '" ' +
    'src="' + src + '" width="' + width + '" height="' + height + '" alt="" style="width:' + width + 'px;height:' + height + 'px;object-fit:contain;" />';
}

function wireMascotFallbacks(root){
  var scope = root || document;
  Array.prototype.forEach.call(scope.querySelectorAll(".mascot-img"), function(img){
    img.onerror = function(){
      var cat = img.getAttribute("data-cat");
      var size = parseInt(img.getAttribute("data-size"), 10) || 96;
      var fallback = img.getAttribute("data-fallback") || (CATEGORY_META[cat] || {}).pop || "#7C3AED";
      var wrapper = document.createElement("div");
      wrapper.innerHTML = mascotSvg(fallback, size);

/* ============================================================
   SCORING
   ============================================================ */
function matchScore(userStance, candStance){
  if(userStance === candStance) return 1;
  if(userStance === "neutre" || candStance === "neutre") return 0.5;
  return 0;
}
function computeResults(profile){
  var candidates = getCandidates().filter(function(c){ return !c.withdrawn; });
  var answers = profile.answers || {};
  var answeredIds = Object.keys(answers);
  return candidates.map(function(c){
    var wsum = 0, ssum = 0, n = 0;
    answeredIds.forEach(function(tid){
      var a = answers[tid];
      var pos = c.positions[tid];
      if(!pos) return;
      var w = a.importance;
      wsum += w;
      ssum += w * matchScore(a.stance, pos.stance);
      n++;
    });
    var pct = wsum > 0 ? Math.round((ssum / wsum) * 100) : null;
    return {candidate:c, pct:pct, answeredCount:n};
  }).sort(function(a,b){
    if(a.pct === null) return 1;
    if(b.pct === null) return -1;
    return b.pct - a.pct;
  });
}
function computeTopCategories(profile){
  var topics = getTopics();
  var topicsById = {}; topics.forEach(function(t){ topicsById[t.id] = t; });
  var answers = profile.answers || {};
  var counts = {};
  Object.keys(answers).forEach(function(tid){
    if(answers[tid].importance !== 3) return;
    var t = topicsById[tid];
    if(!t) return;
    counts[t.cat] = (counts[t.cat] || 0) + 1;
  });
  var ranked = Object.keys(counts).sort(function(a,b){ return counts[b] - counts[a]; });
  if(!ranked.length){
    Object.keys(answers).forEach(function(tid){
      var t = topicsById[tid];
      if(!t) return;
      counts[t.cat] = (counts[t.cat] || 0) + 1;
    });
    ranked = Object.keys(counts).sort(function(a,b){ return counts[b] - counts[a]; });
  }
  return ranked.slice(0,3);
}

var ENGAGEMENT_LEVELS = [
  {min:0, name:"Citoyen en éveil"},
  {min:0.2, name:"Citoyen informé"},
  {min:0.5, name:"Citoyen engagé"},
  {min:0.8, name:"Citoyen expert"},
  {min:1, name:"Citoyen complet"}
];

function computeEngagementLevel(profile){
  var topics = getTopics();
  var answered = Object.keys(profile.answers || {}).length;
  var ratio = topics.length ? answered / topics.length : 0;
  var idx = 0;
  for(var i=0;i<ENGAGEMENT_LEVELS.length;i++){
    if(ratio >= ENGAGEMENT_LEVELS[i].min) idx = i;
  }
  var next = ENGAGEMENT_LEVELS[idx+1];
  var nextAt = next ? Math.ceil(next.min * topics.length) : null;
  return {
    level: idx + 1,
    name: ENGAGEMENT_LEVELS[idx].name,
    answered: answered,
    total: topics.length,
    pct: topics.length ? Math.round((answered / topics.length) * 100) : 0,
    nextAt: nextAt,
    nextName: next ? next.name : null
  };
}

function computeTopReasons(profile, candidate){
  var topics = getTopics();
  var topicsById = {}; topics.forEach(function(t){ topicsById[t.id] = t; });
  var answers = profile.answers || {};
  var reasons = [];
  Object.keys(answers).forEach(function(tid){
    var a = answers[tid];
    if(a.importance !== 3) return;
    var pos = candidate.positions[tid];
    var t = topicsById[tid];
    if(!pos || !t) return;
    reasons.push({topic:t, score:matchScore(a.stance, pos.stance)});
  });
  reasons.sort(function(a,b){ return b.score - a.score; });
  return reasons.slice(0,5);
}

/* ============================================================
   SCREEN — VOTE
   ============================================================ */
function startVoteFlow(){
  var profile = activeProfile();
  var topics = getTopics();
  var answered = profile.answers || {};
  var unanswered = topics.filter(function(t){ return !answered[t.id]; }).map(function(t){return t.id;});
  var answeredIds = topics.filter(function(t){ return answered[t.id]; }).map(function(t){return t.id;});
  state.voteQueue = unanswered.length ? unanswered : answeredIds;
  state.voteIndex = 0;
  state.voteStep = "stance";
  state.pendingStance = null;
  state.screen = "vote";
  render();
}

var STANCE_LABEL = {pour:"D'accord", contre:"Pas d'accord", neutre:"Neutre"};
var STANCE_ICON = {pour:"✓", contre:"✕", neutre:"–"};
var STANCE_COLORVAR = {pour:"--good", contre:"--bad", neutre:"--neutral"};
var IMPORTANCE_LABEL = {1:"Peu important", 2:"Important", 3:"Très important"};

function topicHeaderHtml(topic){
  var hint = topic.context ? '<span class="context-hint">ⓘ</span>' : '';
  var panel = topic.context ? '<div class="context-panel">' + escapeHtml(topic.context) + '</div>' : '';
  return '<span class="cat">' + escapeHtml(topic.cat) + '</span>' +
    '<div class="statement">' + escapeHtml(topic.statement) + hint + '</div>' +
    panel;
}
function wireContextToggle(){
  var stmt = document.querySelector(".statement");
  var panel = document.querySelector(".context-panel");
  if(stmt && panel){
    stmt.onclick = function(e){ e.stopPropagation(); panel.classList.toggle("open"); };
  }
}

function renderVote(){
  var profile = activeProfile();
  var topics = getTopics();
  var topicsById = {}; topics.forEach(function(t){ topicsById[t.id]=t; });
  var total = state.voteQueue.length;

  if(!total || state.voteIndex >= total){
    state.screen = "results";
    render();
    return;
  }

  var topic = topicsById[state.voteQueue[state.voteIndex]];
  var existing = (profile.answers || {})[topic.id];
  var progressPct = Math.round((state.voteIndex / total) * 100);

  var bodyHtml = "";
  if(state.voteStep === "stance"){
    bodyHtml =
      '<div class="vote-card" id="vote-card">' +
        topicHeaderHtml(topic) +
        '<div class="swipe-hint"><span>← glisser : pas d\'accord</span><span>glisser : d\'accord →</span></div>' +
      '</div>' +
      '<div class="stance-buttons">' +
        '<button class="stance-btn contre" data-stance="contre"><span class="ic">✕</span>Pas d\'accord</button>' +
        '<button class="stance-btn neutre" data-stance="neutre"><span class="ic">–</span>Neutre</button>' +
        '<button class="stance-btn pour" data-stance="pour"><span class="ic">✓</span>D\'accord</button>' +
      '</div>' +
      '<button class="skip-link" id="skip-topic">Passer ce sujet</button>';
  } else if(state.voteStep === "importance"){
    bodyHtml =
      '<div class="vote-card">' +
        topicHeaderHtml(topic) +
      '</div>' +
      '<div style="margin-top:16px; font-size:13.5px; color:var(--ink-soft);">Quelle importance ce sujet a-t-il pour toi ?</div>' +
      '<div class="importance-row">' +
        [1,2,3].map(function(v){
          return '<button class="imp-btn" data-imp="' + v + '">' + IMPORTANCE_LABEL[v] + '</button>';
        }).join("") +
      '</div>';
  } else {
    var stance = state.pendingStance;
    var candidates = getCandidates().filter(function(c){ return !c.withdrawn; });
    var chips = candidates.map(function(c){
      var pos = c.positions[topic.id];
      if(!pos) return "";
      return '<div class="reveal-chip"><span class="ic" style="color:var(' + STANCE_COLORVAR[pos.stance] + ')">' + STANCE_ICON[pos.stance] + '</span>' + escapeHtml(c.name.split(" ").slice(-1)[0]) + '</div>';
    }).join("");
    bodyHtml =
      '<div class="vote-card">' +
        topicHeaderHtml(topic) +
        '<div style="margin-top:14px; font-size:13px; color:var(--ink-soft);">Ton avis : <strong style="color:var(' + STANCE_COLORVAR[stance] + ')">' + STANCE_LABEL[stance] + '</strong></div>' +
      '</div>' +
      '<div style="margin-top:16px; font-size:12px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.05em; font-family:var(--mono);">Position des candidats</div>' +
      '<div class="reveal-row">' + chips + '</div>' +
      '<button class="btn btn-primary btn-block" id="next-topic" style="margin-top:20px;">Sujet suivant</button>';
  }

  var html =
    '<div class="vote-progress"><div class="progress-track"><div class="progress-fill" style="width:' + progressPct + '%"></div></div>' +
    '<div class="count mono">' + (state.voteIndex+1) + ' / ' + total + '</div></div>' +
    '<div class="card-stack">' + bodyHtml + '</div>';

  document.getElementById("app").innerHTML = html;
  wireContextToggle();
  wireVoteInteractions(topic, existing);
}

function wireVoteInteractions(topic, existing){
  if(state.voteStep === "stance"){
    document.querySelectorAll(".stance-btn").forEach(function(btn){
      btn.onclick = function(){
        state.pendingStance = btn.getAttribute("data-stance");
        state.voteStep = "importance";
        render();
      };
    });
    var skip = document.getElementById("skip-topic");
    if(skip) skip.onclick = function(){ advanceVote(); };
    wireSwipe();
  } else if(state.voteStep === "importance"){
    document.querySelectorAll(".imp-btn").forEach(function(btn){
      btn.onclick = function(){
        var imp = parseInt(btn.getAttribute("data-imp"), 10);
        updateActiveProfile(function(p){
          p.answers = p.answers || {};
          p.answers[topic.id] = {stance: state.pendingStance, importance: imp};
        });
        state.voteStep = "reveal";
        render();
      };
    });
  } else if(state.voteStep === "reveal"){
    var nxt = document.getElementById("next-topic");
    if(nxt) nxt.onclick = function(){ advanceVote(); };
  }
}

function advanceVote(){
  state.voteIndex++;
  state.voteStep = "stance";
  state.pendingStance = null;
  render();
}

function wireSwipe(){
  var card = document.getElementById("vote-card");
  if(!card) return;
  var startX=0, startY=0, dx=0, dragging=false;
  function onDown(e){
    dragging = true;
    var p = e.touches ? e.touches[0] : e;
    startX = p.clientX; startY = p.clientY;
    card.style.transition = "none";
  }
  function onMove(e){
    if(!dragging) return;
    var p = e.touches ? e.touches[0] : e;
    dx = p.clientX - startX;
    var dy = p.clientY - startY;
    if(Math.abs(dx) > Math.abs(dy)){ e.preventDefault(); }
    card.style.transform = "translate(" + dx + "px," + (dy*0.15) + "px) rotate(" + (dx/22) + "deg)";
  }
  function onUp(){
    if(!dragging) return;
    dragging = false;
    card.style.transition = "transform .2s ease";
    if(dx > 90){
      state.pendingStance = "pour"; card.style.transform = "translate(600px,-40px) rotate(18deg)";
      setTimeout(function(){ state.voteStep="importance"; render(); }, 140);
    } else if(dx < -90){
      state.pendingStance = "contre"; card.style.transform = "translate(-600px,-40px) rotate(-18deg)";
      setTimeout(function(){ state.voteStep="importance"; render(); }, 140);
    } else {
      card.style.transform = "translate(0,0) rotate(0)";
    }
    dx = 0;
  }
  card.addEventListener("mousedown", onDown);
  window.addEventListener("mousemove", onMove);
  window.addEventListener("mouseup", onUp);
  card.addEventListener("touchstart", onDown, {passive:true});
  card.addEventListener("touchmove", onMove, {passive:false});
  card.addEventListener("touchend", onUp);
}

function renderResults(){

  if(answered === 0){

      '<button class="btn btn-accent btn-block" id="btn-go-vote" style="margin-top:14px;">Répondre aux sujets</button>';

  }

        '<span class="podium-medal">' + medalLabel[i] + '</span>' +

        '<div class="podium-name">' + escapeHtml(r.candidate.name) + '</div>' +
        '<div class="podium-party">' + escapeHtml(r.candidate.party) + '</div>' +
        '<div class="podium-score">' + r.pct + '%</div>' +

      '</div>';

    return '<div class="result-row" data-cand="' + r.candidate.id + '">' +
      '<div class="result-top">' +
        '<div class="result-rank mono">' + (i+1) + '</div>' +

        '<div class="result-score mono">' + (r.pct===null? "—" : pct + "%") + '</div>' +
      '</div>' +
      '<div class="result-bar-track"><div class="result-bar-fill" style="width:' + pct + '%; background:' + r.candidate.color + '"></div></div>' +
      '<div class="result-detail" id="detail-' + r.candidate.id + '"></div>' +
    '</div>';
  }).join("");

  var signupCta = "";
  if(!isLoggedIn() && !state.dismissedSignupCta){
    signupCta = '<div class="sponsor-card" id="signup-cta" style="margin-top:18px;">' +
      '<div class="sponsor-label">Nouveau</div>' +
      '<div class="sponsor-name">Garde ce classement à jour</div>' +
      '<div class="sponsor-tagline">Le questionnaire évolue : de nouveaux sujets et candidats s\'ajoutent régulièrement. Crée un compte gratuit par email pour retrouver tes réponses sur n\'importe quel appareil.</div>' +
      '<div style="margin-top:12px;"><input type="email" id="signup-email" placeholder="toi@exemple.fr" /></div>' +
      '<label class="field-label" style="display:flex; align-items:center; gap:7px; cursor:pointer; margin-top:10px; font-weight:400;">' +
        '<input type="checkbox" id="signup-optin" style="width:auto;" /> Me tenir informé par email des nouveaux sujets' +
      '</label>' +
      '<button class="btn btn-accent btn-block" id="signup-submit" style="margin-top:12px;">Créer mon compte gratuit</button>' +
      '<button class="btn btn-ghost btn-block" id="signup-later" style="margin-top:8px;">Plus tard</button>' +
      (authMessage ? '<p class="intro-copy" style="margin-top:10px;">' + escapeHtml(authMessage) + '</p>' : '') +
    '</div>';
  }

  var html = '<div id="sponsor-slot-results" style="margin-bottom:16px;"></div>' +
    '<span class="eyebrow">' + answered + ' / ' + topics.length + ' sujets pris en compte</span>' +
    '<h1>Tes affinités</h1>' +
    '<p class="intro-copy">Classement pondéré par l\'importance que tu as donnée à chaque sujet.</p>' +
    podiumHtml +
    (podiumOrder.length ? '<button class="btn btn-ghost btn-block" id="btn-share">Partager mon classement</button>' : '') +
    signupCta +
    '<div class="results-subhead" style="margin-top:22px;">Classement complet — touche un candidat pour le détail</div>' +
    '<div>' + rows + '</div>' +
    (answered < topics.length ? '<button class="btn btn-ghost btn-block" id="btn-more" style="margin-top:8px;">Répondre aux ' + (topics.length-answered) + ' sujets restants</button>' : '');

  document.getElementById("app").innerHTML = html;

  document.querySelectorAll(".result-row").forEach(function(row){
    row.addEventListener("click", function(){
      var wasOpen = row.classList.contains("open");
      document.querySelectorAll(".result-row").forEach(function(r){ r.classList.remove("open"); });
      if(wasOpen) return;
      row.classList.add("open");
      var id = row.getAttribute("data-cand");
      var cand = getCandidates().filter(function(c){return c.id===id;})[0];
      var det = document.getElementById("detail-" + id);
      var items = Object.keys(profile.answers).map(function(tid){
        var t = topics.filter(function(x){return x.id===tid;})[0];
        var pos = cand.positions[tid];
        if(!t || !pos) return "";
        var userA = profile.answers[tid];
        var agree = matchScore(userA.stance, pos.stance);
        var ic = agree === 1 ? '<span style="color:var(--good)">✓</span>' : agree === 0 ? '<span style="color:var(--bad)">✕</span>' : '<span style="color:var(--neutral)">–</span>';
        return '<div class="rd-item"><span class="ic">' + ic + '</span><div class="txt"><b>' + escapeHtml(t.statement) + '</b><br>' + escapeHtml(pos.detail) + '</div></div>';
      }).join("");
      det.innerHTML = items;
    });
  });

  var more = document.getElementById("btn-more");
  if(more) more.onclick = startVoteFlow;

  var signupSubmit = document.getElementById("signup-submit");
  if(signupSubmit) signupSubmit.onclick = function(){
    if(!sb || authBusy) return;
    var emailInput = document.getElementById("signup-email");
    var email = emailInput.value.trim();
    if(!email){ emailInput.focus(); return; }
    var optin = document.getElementById("signup-optin").checked;
    authBusy = true;
    signupSubmit.disabled = true;
    signupSubmit.textContent = "Envoi en cours…";
    safeSet(LS_PENDING_KIT, state.activeProfileId);
    safeSet(LS_PENDING_OPTIN, optin);
    sb.auth.signInWithOtp({ email: email, options: { emailRedirectTo: window.location.origin } }).then(function(res){

        ? "Une erreur est survenue, réessaie dans un instant."

      render();
    });
  };
  var signupLater = document.getElementById("signup-later");
  if(signupLater) signupLater.onclick = function(){
    state.dismissedSignupCta = true;
    authMessage = null;
    render();
  };

  var shareBtn = document.getElementById("btn-share");
  if(shareBtn) shareBtn.onclick = function(){
    var lines = podiumOrder.map(function(r, i){
      return (i+1) + ". " + r.candidate.name + " (" + r.pct + "%)";
    });
    var text = "Mon classement sur Votona :\n" + lines.join("\n") + "\n\nFais le test toi aussi : " + location.href;
    if(navigator.share){
      navigator.share({text: text}).catch(function(){});
    } else if(navigator.clipboard){
      navigator.clipboard.writeText(text).then(function(){
        shareBtn.textContent = "Copié dans le presse-papiers !";
        setTimeout(function(){ shareBtn.textContent = "Partager mon classement"; }, 2200);
      }).catch(function(){});
    }
  };
}

    var reasonsHtml = reasons.map(function(r){
      var agree = r.score === 1;
      return '<div class="glossary-card"><div class="term" style="color:' + (agree ? "var(--good)" : "var(--ink-faint)") + ';">' +
        (agree ? "✓ Accord" : "≈ Neutre") + '</div><div class="def">' + escapeHtml(r.topic.statement) + '</div></div>';
    }).join("");
    modalHtml = '<div class="kit-modal-overlay" id="kit-modal-overlay">' +
        '<div class="kit-modal-card">' +
          '<button class="kit-modal-close" id="kit-modal-close">✕</button>' +
          '<div class="kit-modal-header">' +
            '<div class="kit-modal-icon" style="background:color-mix(in srgb, ' + pop + ' 20%, transparent); color:' + pop + ';">🏅</div>' +
            '<div class="kit-modal-title">Niveau ' + level.level + ' · ' + escapeHtml(level.name) + '</div>' +
          '</div>' +
          (topCandidate
            ? '<div class="kit-modal-desc">Les sujets qui comptaient le plus pour toi, et qui ont mis <strong>' + escapeHtml(topCandidate.name) + '</strong> en tête de ton classement.</div>'
            : '<div class="kit-modal-desc">Réponds à quelques sujets pour voir apparaître ton candidat en tête.</div>') +
          (reasonsHtml ? '<div class="glossary-grid">' + reasonsHtml + '</div>' : '') +
        '</div>' +
      '</div>';
  } else if(state.kitModalCat){
    var activeDetail = themeDetails.filter(function(d){ return d.cat === state.kitModalCat; })[0];
    if(activeDetail){
      var dc = activeDetail.meta.pop || pop;
      var mediaModalHtml = activeDetail.media.map(function(s){
        var tm = MEDIA_TYPE_META[s.type] || {ic:"", label:""};
        return '<a class="axis-card" href="' + escapeHtml(s.url) + '" target="_blank" rel="noopener">' +
          '<span class="media-type-tag ' + escapeHtml(s.type) + '">' + tm.ic + ' ' + escapeHtml(tm.label) + '</span>' +
          '<div class="t">' + escapeHtml(s.name) + '</div>' +
          '<div class="d">' + escapeHtml(s.d) + '</div></a>';
      }).join("");
      var glossaryModalHtml = activeDetail.glossary
        ? '<div class="glossary-card"><div class="term">' + escapeHtml(activeDetail.glossary.term) + '</div><div class="def">' + escapeHtml(activeDetail.glossary.d) + '</div></div>'
        : "";
      modalHtml = '<div class="kit-modal-overlay" id="kit-modal-overlay">' +
          '<div class="kit-modal-card">' +
            '<button class="kit-modal-close" id="kit-modal-close">✕</button>' +
            '<div class="kit-modal-header">' +
              '<div class="kit-modal-icon" style="background:color-mix(in srgb, ' + dc + ' 20%, transparent); color:' + dc + ';">' + (activeDetail.meta.ic || "") + '</div>' +
              '<div class="kit-modal-title">' + escapeHtml(activeDetail.cat) + '</div>' +
            '</div>' +
            '<div class="kit-modal-desc">' + escapeHtml(activeDetail.meta.d || "") + '</div>' +
            (mediaModalHtml ? '<div class="kit-modal-section-label">Pour approfondir</div><div class="media-links" style="margin-bottom:20px;">' + mediaModalHtml + '</div>' : '') +
            (glossaryModalHtml ? '<div class="kit-modal-section-label">Glossaire</div><div class="glossary-grid">' + glossaryModalHtml + '</div>' : '') +
          '</div>' +
        '</div>';
    }
  }

  var html = '<span class="eyebrow">Bienvenue ' + escapeHtml(profile.name) + '</span>' +
    '<h1>Ton kit pour la présidentielle</h1>' +
    '<p class="intro-copy">Un résumé de ton profil politique, et tout ce qu\'il faut savoir pour voter le moment venu.</p>' +
    blisterCardHtml +
    (candidatesHtml ? '<section class="landing-section"><h2>Tes candidats</h2><div class="sub">D\'après tes réponses au questionnaire.</div><div class="candidate-list">' + candidatesHtml + '</div></section>' : '') +
    '<div style="margin-top:24px;"><button class="btn btn-accent btn-block" id="kit-continue">Voir mon tableau de bord</button></div>' +
    modalHtml;

  document.getElementById("app").innerHTML = html;
  wireMascotFallbacks();
  wirePropFallbacks();
  document.getElementById("kit-continue").onclick = function(){
    state.kitModalCat = null;
    state.screen = "dashboard";
    render();
  };
  var shareBtn = document.getElementById("kit-share-btn");
  if(shareBtn) shareBtn.onclick = function(){
    state.kitModalCat = null;
    state.screen = "kitShare";
    render();
  };
  Array.prototype.forEach.call(document.querySelectorAll(".blister-item"), function(btn){
    btn.onclick = function(){
      state.kitModalCat = btn.getAttribute("data-cat");
      renderKit();
    };
  });
  var modalOverlay = document.getElementById("kit-modal-overlay");
  if(modalOverlay) modalOverlay.onclick = function(e){
    if(e.target === modalOverlay){ state.kitModalCat = null; renderKit(); }
  };
  var modalClose = document.getElementById("kit-modal-close");
  if(modalClose) modalClose.onclick = function(){
    state.kitModalCat = null;
    renderKit();
  };
}

/* ============================================================
   SCREEN — KIT SHARE (carte de profil façon "starter pack" à
   capturer et partager sur les réseaux sociaux)
   ============================================================ */
function renderKitShare(){
  var profile = activeProfile();
  if(!profile){ state.screen = "profiles"; render(); return; }
  var topCats = computeTopCategories(profile);
  var topArchetype = topCats.length ? (CATEGORY_META[topCats[0]] || {}) : {};
  var pop = topArchetype.pop || "#7C3AED";
  var level = computeEngagementLevel(profile);
  var wordsHtml = topCats.map(function(cat){
    var m = CATEGORY_META[cat] || {};
    return m.word ? '<span class="share-pill">' + (m.ic || "") + ' ' + escapeHtml(m.word) + '</span>' : "";
  }).join("");

  var html = '<div class="share-card" style="background:' + pop + ';">' +
      '<div class="share-brand">🗳️ Votona</div>' +
      '<div class="share-mascot">' + mascotImgHtml(topCats[0], level.level, 90, 190, "#ffffff") + '</div>' +
      '<div class="share-level">Niveau ' + level.level + ' · ' + escapeHtml(level.name) + '</div>' +
      '<div class="share-name">' + escapeHtml(topArchetype.archetype || "Citoyen Engagé") + '</div>' +
      '<div class="share-words">' + wordsHtml + '</div>' +
      '<div class="share-footer">votona.vercel.app</div>' +
    '</div>' +
    '<p class="intro-copy" style="text-align:center;margin-top:18px;">Fais une capture d\'écran pour partager ton profil sur les réseaux.</p>' +
    '<button class="btn btn-ghost btn-block" id="share-back" style="margin-top:14px;">← Retour au kit</button>';

  document.getElementById("app").innerHTML = html;
  wireMascotFallbacks();
  document.getElementById("share-back").onclick = function(){
    state.screen = "kit";
    render();
  };
}

/* ============================================================
   SCREEN — FAQ
   ============================================================ */
function renderFaq(){
  var html = '<span class="eyebrow">Questions fréquentes</span>' +
    '<h1>Tout comprendre sur Votona</h1>' +
    '<p class="intro-copy">Fonctionnement du classement, données, candidats, mises à jour : les réponses aux questions les plus posées.</p>' +
    '<div style="margin-top:10px;">' + faqHtml() + '</div>' +
    '<button class="btn btn-ghost btn-block" id="btn-faq-back" style="margin-top:22px;">← Retour</button>';
  document.getElementById("app").innerHTML = html;
  wireFaqToggles();
  document.getElementById("btn-faq-back").onclick = function(){
    state.screen = activeProfile() ? "dashboard" : "profiles";
    render();
  };
}

/* ============================================================
   SCREEN — COMPTE
   ============================================================ */
function renderAccount(){
  var html;
  if(!sb){
    html = '<h1>Mon compte</h1><p class="intro-copy">La connexion par email n\'est pas disponible pour le moment.</p>';
  } else if(isLoggedIn()){
    html = '<h1>Mon compte</h1>' +
      '<p class="intro-copy">Connecté avec <strong>' + escapeHtml(authSession.user.email) + '</strong>. Tes profils et réponses sont synchronisés — reconnecte-toi avec cet email sur n\'importe quel appareil pour les retrouver.</p>' +
      '<button class="btn btn-ghost btn-block" id="btn-signout" style="margin-top:16px;">Se déconnecter</button>';
  } else {
    html = '<h1>Mon compte</h1>' +
      '<p class="intro-copy">Connecte-toi par email pour retrouver tes profils et réponses sur un autre appareil. Sans connexion, tout continue de fonctionner normalement, gardé uniquement sur cet appareil.</p>' +
      '<div style="margin-top:16px;"><label class="field-label">Adresse email</label>' +
      '<input type="email" id="account-email" placeholder="toi@exemple.fr" /></div>' +
      '<button class="btn btn-accent btn-block" id="btn-send-link" style="margin-top:12px;">Envoyer le lien magique</button>' +
      (authMessage ? '<p class="intro-copy" style="margin-top:12px;">' + escapeHtml(authMessage) + '</p>' : '');
  }
  html += '<button class="btn btn-ghost btn-block" id="btn-account-back" style="margin-top:22px;">← Retour</button>';
  document.getElementById("app").innerHTML = html;

  var signout = document.getElementById("btn-signout");
  if(signout) signout.onclick = function(){
    sb.auth.signOut().then(function(){
      authSession = null;
      render();
    });
  };
  var sendLink = document.getElementById("btn-send-link");
  if(sendLink) sendLink.onclick = function(){
    if(authBusy) return;
    var input = document.getElementById("account-email");
    var email = input.value.trim();
    if(!email){ input.focus(); return; }
    authBusy = true;
    sendLink.disabled = true;
    sendLink.textContent = "Envoi en cours…";
    sb.auth.signInWithOtp({ email: email, options: { emailRedirectTo: window.location.origin } }).then(function(res){
      authBusy = false;
      authMessage = res.error
        ? "Une erreur est survenue, réessaie dans un instant."
        : "Lien envoyé ! Vérifie ta boîte mail (" + email + ") et clique sur le lien pour te connecter.";
      render();
    });
  };
  document.getElementById("btn-account-back").onclick = function(){
    authMessage = null;
    state.screen = activeProfile() ? "dashboard" : "profiles";
    render();
  };
}

/* ============================================================
   SCREEN — ADMIN
   ============================================================ */
function renderAdmin(){
  var candidates = getCandidates();
  var topics = getTopics();

  var tabsHtml = '<div class="admin-tabs">' +
    '<button class="admin-tab' + (state.adminTab==="candidates"?" active":"") + '" data-tab="candidates">Candidats</button>' +
    '<button class="admin-tab' + (state.adminTab==="topics"?" active":"") + '" data-tab="topics">Sujets</button>' +
  '</div>';

  var disclaimer = state.adminTab === "candidates"
    ? '<div class="disclaimer">Seule la veille automatique quotidienne ajoute de nouveaux candidats. Tu peux corriger une position ici si elle te semble erronée ; ces corrections restent propres à ce navigateur.</div>'
    : '<div class="disclaimer">Seule la veille automatique quotidienne ajoute de nouveaux sujets, lorsqu\'un thème de campagne majeur émerge.</div>';

  var body = "";
  if(state.adminTab === "candidates"){
    var ovForList = loadOverrides();
    body = candidates.map(function(c){
      var open = state.adminOpenId === c.id;
      var isCustom = (ovForList.newCandidates||[]).some(function(nc){return nc.id===c.id;});
      var posRows = topics.map(function(t){
        var pos = c.positions[t.id] || {stance:"neutre", detail:""};
        return '<div class="pos-row" data-topic="' + t.id + '">' +
          '<div class="topic-txt">' + escapeHtml(t.statement) + '</div>' +
          '<select data-field="stance">' +
            ["pour","neutre","contre"].map(function(s){ return '<option value="'+s+'"' + (pos.stance===s?" selected":"") + '>' + STANCE_LABEL[s] + '</option>'; }).join("") +
          '</select>' +
          '<input type="text" class="pos-detail" data-field="detail" placeholder="Détail (optionnel)" value="' + escapeHtml(pos.detail||"") + '" />' +
        '</div>';
      }).join("");
      return '<div class="admin-item' + (open?" open":"") + '" data-cand="' + c.id + '">' +
        '<div class="admin-item-head" data-toggle="' + c.id + '"><span class="swatch" style="background:' + c.color + '"></span>' +
          '<span class="t">' + escapeHtml(c.name) + '</span><span class="meta">' + escapeHtml(c.party) + '</span>' +
          (c.withdrawn ? '<span class="badge-withdrawn">Retiré</span>' : '') + '</div>' +
        '<div class="admin-form">' +
          '<div><label class="field-label">Nom</label><input type="text" data-field="name" value="' + escapeHtml(c.name) + '" /></div>' +
          '<div><label class="field-label">Parti / étiquette</label><input type="text" data-field="party" value="' + escapeHtml(c.party) + '" /></div>' +
          '<label class="field-label" style="display:flex; align-items:center; gap:7px; cursor:pointer;">' +
            '<input type="checkbox" data-field="withdrawn"' + (c.withdrawn ? " checked" : "") + ' style="width:auto;" /> Candidature retirée' +
          '</label>' +
          '<div><label class="field-label">Positions par sujet</label><div class="pos-grid">' + posRows + '</div></div>' +
          '<div class="form-actions"><button class="btn btn-primary btn-sm" data-save="' + c.id + '">Enregistrer</button>' +
            (isCustom ? '<button class="danger-link" data-delete="' + c.id + '" style="margin-left:auto;">Supprimer ce candidat</button>' : '') +
          '</div>' +
        '</div></div>';
    }).join("");
  } else {
    body = topics.map(function(t){
      return '<div class="admin-item"><div class="admin-item-head"><span class="t">' + escapeHtml(t.statement) + '</span></div>' +
        '<div class="meta" style="margin-top:4px;">' + escapeHtml(t.cat) + '</div></div>';
    }).join("");
  }

  document.getElementById("app").innerHTML =
    '<h1>Gérer candidats et sujets</h1>' + disclaimer + tabsHtml + '<div>' + body + '</div>';

  document.querySelectorAll(".admin-tab").forEach(function(t){
    t.onclick = function(){ state.adminTab = t.getAttribute("data-tab"); state.adminOpenId=null; render(); };
  });

  if(state.adminTab === "candidates"){
    document.querySelectorAll("[data-toggle]").forEach(function(h){
      h.onclick = function(){
        var id = h.getAttribute("data-toggle");
        state.adminOpenId = state.adminOpenId === id ? null : id;
        render();
      };
    });
    document.querySelectorAll("[data-save]").forEach(function(btn){
      btn.onclick = function(){
        var id = btn.getAttribute("data-save");
        var item = document.querySelector('.admin-item[data-cand="' + id + '"]');
        var name = item.querySelector('[data-field="name"]').value.trim();
        var party = item.querySelector('[data-field="party"]').value.trim();
        var withdrawn = item.querySelector('[data-field="withdrawn"]').checked;
        var positions = {};
        item.querySelectorAll(".pos-row").forEach(function(row){
          var tid = row.getAttribute("data-topic");
          positions[tid] = {
            stance: row.querySelector('[data-field="stance"]').value,
            detail: row.querySelector('[data-field="detail"]').value.trim()
          };
        });
        var ov = loadOverrides();
        var isCustom = (ov.newCandidates||[]).some(function(c){return c.id===id;});
        if(isCustom){
          ov.newCandidates = ov.newCandidates.map(function(c){
            if(c.id!==id) return c;
            return Object.assign({}, c, {name:name, party:party, withdrawn:withdrawn, positions:positions});
          });
        } else {
          ov.candidateOverrides = ov.candidateOverrides || {};
          ov.candidateOverrides[id] = {name:name, party:party, withdrawn:withdrawn, positions:positions};
        }
        saveOverrides(ov);
        state.adminOpenId = null;
        render();
      };
    });
    document.querySelectorAll("[data-delete]").forEach(function(btn){
      btn.onclick = function(){
        var id = btn.getAttribute("data-delete");
        var ov = loadOverrides();
        ov.newCandidates = (ov.newCandidates||[]).filter(function(c){return c.id!==id;});
        delete (ov.candidateOverrides||{})[id];
        saveOverrides(ov);
        state.adminOpenId = null;
        render();
      };
    });
  }
}

/* ============================================================
   ROUTER
   ============================================================ */
function fillSponsorEl(el){
  if(!el) return;
  var s = SPONSORS.filter(function(x){ return x.active; })[0];
  if(!s){ el.innerHTML = ""; return; }
  var inner =
    '<span class="sponsor-label">' + escapeHtml(s.label || "Publicité") + '</span>' +
    '<div class="sponsor-name">' + escapeHtml(s.name) + '</div>' +
    (s.tagline ? '<div class="sponsor-tagline">' + escapeHtml(s.tagline) + '</div>' : '');
  if(s.url){
    el.innerHTML = '<a class="sponsor-card" href="' + escapeHtml(s.url) + '" target="_blank" rel="noopener sponsored">' + inner + '</a>';
  } else {
    el.innerHTML = '<div class="sponsor-card">' + inner + '</div>';
  }
}
/* Sur dashboard/résultats, la bannière se cale tout en haut de l'écran
   (avant même le titre / le podium) pour rester visible sans le moindre
   scroll ; sur les autres écrans elle reste dans le footer partagé. */
function renderSponsor(){
  var dash = document.getElementById("sponsor-slot-dash");
  var results = document.getElementById("sponsor-slot-results");
  var footer = document.getElementById("sponsor-slot");
  var inline = dash || results;
  if(inline){
    fillSponsorEl(inline);
    if(footer) footer.innerHTML = "";
  } else if(footer){
    fillSponsorEl(footer);
  }
}

function render(){
  renderTopbar();
  document.getElementById("app").classList.toggle("app-wide", state.screen === "profiles" || state.screen === "dashboard" || state.screen === "kit");
  if(state.screen === "profiles") renderProfiles();
  else if(state.screen === "dashboard") renderDashboard();
  else if(state.screen === "vote") renderVote();
  else if(state.screen === "results") renderResults();
  else if(state.screen === "kit") renderKit();
  else if(state.screen === "kitShare") renderKitShare();
  else if(state.screen === "faq") renderFaq();
  else if(state.screen === "account") renderAccount();
  else if(state.screen === "admin") renderAdmin();
  renderSponsor();
  window.scrollTo(0,0);
}

if(sb){
  sb.auth.onAuthStateChange(function(event, session){
    authSession = session;
    if(session){ syncAfterLogin(); } else { render(); }
  });
}
render();
})();
</script>
